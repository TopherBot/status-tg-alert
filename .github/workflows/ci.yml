name: CI & Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # Run fast checks on every PR
  push:
    branches: [main]
    # Run build & deploy on merge to main
  workflow_dispatch:
    inputs:
      preview:
        description: 'Create a preview deployment (opt‑in)'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy .
      - name: Unit tests
        run: pytest -q

  build-push:
    name: Build & Push Docker Image
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (optional)
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'your‑user/status‑tg‑alert'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            docker stop status-tg-alert || true
            docker rm status-tg-alert || true
            docker run -d \
              --restart unless-stopped \
              --name status-tg-alert \
              --env-file /home/${{ secrets.DEPLOY_USER }}/status-tg-alert.env \
              ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  preview:
    name: Optional Preview Deploy
    needs: build-push
    if: github.event.inputs.preview == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Echo preview (placeholder)
        run: echo "Preview requested – you can hook this to Netlify/Vercel/Cloud‑Run as needed."
